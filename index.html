<title>Paco's Invitacional 2026</title>
<style>
/* ============================================================
   PACO'S INVITACIONAL 2026 · archivo único autónomo
   8 jugadores · 4 días · foursomes sin repetir
   ============================================================ */
:root{
  --verde:#14392B; --verde-hondo:#0C231A; --verde-linea:#20503C;
  --tarjeta:#F4EFE3; --tarjeta-linea:#DDD4C0;
  --tinta:#1A1D19; --tinta-suave:#5C6459;
  --laton:#C9A227; --bandera:#C0392B; --cal:#8FA396; --ok:#3E7D5A;
  --r:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--verde-hondo);color:var(--tarjeta);font-family:var(--ui);font-size:17px;
  line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:17px}
button{cursor:pointer;border:none;background:none;color:inherit}

header{position:sticky;top:0;z-index:30;background:var(--verde);
  padding:calc(var(--safe-t) + 12px) 16px 0;border-bottom:1px solid var(--verde-linea)}
.marca{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.marca h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.marca .fmt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--laton);border:1px solid var(--laton);border-radius:4px;padding:2px 6px;white-space:nowrap}
.dias{display:flex;gap:6px;margin:11px 0 0;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:1 0 auto;padding:7px 14px;border-radius:99px;font-size:14.5px;font-weight:600;background:transparent;
  color:var(--cal);border:1px solid var(--verde-linea);white-space:nowrap;text-align:left;line-height:1.25}
.dia b{display:block;font-size:14.5px}
.dia i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;opacity:.75}
.dia.on{background:var(--tarjeta);color:var(--verde-hondo);border-color:var(--tarjeta)}

main{padding:14px 16px calc(84px + var(--safe-b));min-height:60vh}
.vista{display:none}
.vista.on{display:block;animation:sube .22s ease}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h2.sec{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cal);margin:20px 0 8px;font-weight:600}
h2.sec:first-child{margin-top:2px}

.hoyo-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tarjeta);
  color:var(--tinta);border-radius:var(--r);padding:12px 10px;margin-bottom:10px}
.flecha{width:46px;height:46px;border-radius:8px;background:var(--verde);color:var(--tarjeta);
  font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.flecha:disabled{opacity:.25}
.hoyo-info{text-align:center;flex:1;min-width:0}
.hoyo-num{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hoyo-num small{font-size:15px;font-weight:600;color:var(--tinta-suave);letter-spacing:0}
.hoyo-meta{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--tinta-suave);
  margin-top:4px;text-transform:uppercase}

.jug-fila{background:var(--tarjeta);color:var(--tinta);border-radius:var(--r);padding:11px 12px;
  margin-bottom:8px;display:flex;align-items:center;gap:11px}
.jug-id{flex:1;min-width:0}

/* ============================================================
   2. FOURSOMES SIN REPETIR
   Dos formas distintas de partir 8 jugadores en 4+4 nunca
   comparten un grupo: si compartieran uno, el complemento sería
   forzoso y serían la misma partición. Por eso basta con elegir
   4 particiones distintas de las 35 posibles para garantizar que
   ningún foursome se repita. La búsqueda usa esa libertad para
   optimizar cómo se reparten las parejas.
   ============================================================ */
function combinaciones(arr,k){
  const res=[];
  (function rec(ini,act){
    if(act.length===k){ res.push([...act]); return; }
    for(let i=ini;i<arr.length;i++){ act.push(arr[i]); rec(i+1,act); act.pop(); }
  })(0,[]);
  return res;
}
/* Los dos calendarios óptimos, ya resueltos.
   Buscarlos en vivo cuesta ~2 s en una laptop y medio minuto en un iPhone,
   y el resultado siempre es el mismo, así que van precalculados.
   Ambos cumplen lo esencial: ningún foursome se repite en los 4 días.
     convivencia → todos juegan con todos; 4 parejas coinciden 3 veces
     equilibrio  → nadie coincide más de 2 veces; 4 parejas no se cruzan  */
const CALENDARIOS = {
  convivencia: [[[0,1,2,3],[4,5,6,7]], [[0,1,4,5],[2,3,6,7]],
                [[0,1,6,7],[2,3,4,5]], [[0,2,4,6],[1,3,5,7]]],
  equilibrio:  [[[0,1,2,3],[4,5,6,7]], [[0,1,4,5],[2,3,6,7]],
                [[0,2,4,6],[1,3,5,7]], [[0,3,5,6],[1,2,4,7]]]
};
function generarGrupos(esquema='convivencia'){
  const cal = CALENDARIOS[esquema] || CALENDARIOS.convivencia;
  return cal.map(dia=>dia.map(g=>g.map(i=>'j'+i)));
}

/* Remapea el calendario para que el día 1 grupo A sean los cuatro
   que ya quedaron acordados, sin tocar la garantía de no repetir.  */
function gruposFijando(esquema,barajar){
  const base=generarGrupos(esquema);
  let a=[...PRIMER_GRUPO];
  let b=S.jugadores.map(j=>j.id).filter(id=>!a.includes(id));
  if(barajar){ a=revolver(a); b=revolver(b); }
  const mapa={};
  base[0][0].forEach((id,i)=>mapa[id]=a[i]);
  base[0][1].forEach((id,i)=>mapa[id]=b[i]);
  return base.map(dia=>dia.map(g=>{
    const m=g.map(id=>mapa[id]);
    return [...m.filter(id=>id!=='j0'), ...m.filter(id=>id==='j0')];   // Paulino al final
  }));
}
function revolver(arr){
  const c=[...arr];
  for(let i=c.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [c[i],c[k]]=[c[k],c[i]]; }
  return c;
}

/* ============================================================
   3. HANDICAP Y PUNTUACIÓN
   ============================================================ */
const jug = id => S.jugadores.find(j=>j.id===id);
const parTotal = c => c.par.reduce((a,b)=>a+b,0);
function hcpCampo(j,c){
  if(!S.torneo.usarHcp) return 0;
  return Math.round(parseFloat(j.indice)||0);   // un solo indice para los cuatro campos
}
function golpesEnHoyo(ch,si){
  if(ch===0) return 0;
  if(ch<0){                                  // jugador "plus": devuelve golpes
    const p=-ch;
    return -(Math.floor(p/18)+(si>18-(p%18)?1:0));
  }
  return Math.floor(ch/18)+(si<=(ch%18)?1:0);
}
function scoreDe(d,jid,h){ const r=S.scores['d'+d]; if(!r||!r[jid]) return null;
  const v=r[jid][h]; return (v===null||v===undefined)?null:v; }
function fijarScore(d,jid,h,v,tRemoto){
  const k='d'+d;
  if(!S.scores[k]) S.scores[k]={};
  if(!S.scores[k][jid]) S.scores[k][jid]=Array(HOYOS).fill(null);
  S.scores[k][jid][h]=v;
  const llave=d+'.'+jid+'.'+h;
  if(tRemoto){ S.ct[llave]=tRemoto; }
  else{
    S.ct[llave]=Date.now();
    if(sincronizando()){
      S.pend.push({d,jid,h,v,t:S.ct[llave]});
      if(S.pend.length>2000) S.pend=S.pend.slice(-1500);
      programarSync();
    }
  }
  guardar();
}
const puntosStableford=(neto,par)=>Math.max(0,2-(neto-par));

function resumenRonda(d,jid){
  const c=S.campos[d], ch=hcpCampo(jug(jid),c);
  let bruto=0,neto=0,pts=0,jugados=0;
  for(let h=0;h<HOYOS;h++){
    const g=scoreDe(d,jid,h); if(g===null) continue;
    jugados++; const n=g-golpesEnHoyo(ch,c.si[h]);
    bruto+=g; neto+=n; pts+=puntosStableford(n,c.par[h]);
  }
  return {bruto,neto,pts,jugados,ch};
}
function resumenTotal(jid){
  let bruto=0,neto=0,pts=0,jugados=0; const rondas=[];
  for(let d=0;d<DIAS;d++){ const r=resumenRonda(d,jid); rondas.push(r);
    bruto+=r.bruto; neto+=r.neto; pts+=r.pts; jugados+=r.jugados; }
  return {bruto,neto,pts,jugados,rondas};
}
const esStableford=()=>S.torneo.formato==='stableford';
const valorOrden=r=>esStableford()?-r.pts:(S.torneo.usarHcp?r.neto:r.bruto);

function claseNota(g,par){
  if(g===null) return '';
  const d=g-par;
  return d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d>=2?'doble':'';
}

function setGrupo(i){ S.grupoActivo=i; borrador=null; guardar(); render(); }
function mueveHoyo(n){ S.hoyoActivo=Math.max(0,Math.min(HOYOS-1,S.hoyoActivo+n)); guardar(); render(); }
function ponPar(jid){ const d=S.diaActivo,h=S.hoyoActivo;
  if(scoreDe(d,jid,h)===null){ fijarScore(d,jid,h,S.campos[d].par[h]); render(); } }
function cambiaGolpe(jid,n){
  const d=S.diaActivo,h=S.hoyoActivo,a=scoreDe(d,jid,h);
  if(a===null) fijarScore(d,jid,h,S.campos[d].par[h]);
  else fijarScore(d,jid,h,(a+n)<1?null:Math.min(15,a+n));
  render();
}

/* ---------- Tarjeta ---------- */
function vistaTarjeta(){
  const d=S.diaActivo,c=S.campos[d];
  const ids=[...S.grupos[d][0],...S.grupos[d][1]];
  const out=c.par.slice(0,9).reduce((a,b)=>a+b,0), inn=c.par.slice(9).reduce((a,b)=>a+b,0);
  let th='<th class="nom">Jugador</th>';
  for(let h=0;h<9;h++) th+=`<th>${h+1}</th>`; th+='<th>OUT</th>';
  for(let h=9;h<18;h++) th+=`<th>${h+1}</th>`; th+='<th>IN</th><th>TOT</th>';
  let fp='<td class="nom">Par</td>';
  for(let h=0;h<9;h++) fp+=`<td>${c.par[h]}</td>`; fp+=`<td>${out}</td>`;
  for(let h=9;h<18;h++) fp+=`<td>${c.par[h]}</td>`; fp+=`<td>${inn}</td><td>${out+inn}</td>`;
  let filas='', filasPts='';
  ids.forEach(jid=>{
    const j=jug(jid); const ch=hcpCampo(j,c); let so=0,si_=0;
    /* ch invisible: iguala el ancho de la columna de nombres entre las dos
       cuadrículas, para que los hoyos queden alineados al moverse juntas */
    let f=`<td class="nom">${esc(corto(j.nombre))}<span class="ch" style="visibility:hidden">${ch}</span></td>`;
    let fq=`<td class="nom">${esc(corto(j.nombre))}<span class="ch">${ch}</span></td>`, po=0, pi=0;
    for(let h=0;h<9;h++){ const g=scoreDe(d,jid,h); if(g!==null) so+=g;
      f+=`<td class="${g===null?'':(g<c.par[h]?'bajo':(g>c.par[h]?'alto':''))}">${g??'·'}</td>`;
      const q=g===null?null:puntosStableford(g-golpesEnHoyo(ch,c.si[h]),c.par[h]); if(q!==null) po+=q;
      fq+=`<td class="${q===null?'':(q>=3?'bajo':(q===0?'alto':''))}">${q??'·'}</td>`; }
    f+=`<td class="tot">${so||'·'}</td>`; fq+=`<td class="tot">${po||'·'}</td>`;
    for(let h=9;h<18;h++){ const g=scoreDe(d,jid,h); if(g!==null) si_+=g;
      f+=`<td class="${g===null?'':(g<c.par[h]?'bajo':(g>c.par[h]?'alto':''))}">${g??'·'}</td>`;
      const q=g===null?null:puntosStableford(g-golpesEnHoyo(ch,c.si[h]),c.par[h]); if(q!==null) pi+=q;
      fq+=`<td class="${q===null?'':(q>=3?'bajo':(q===0?'alto':''))}">${q??'·'}</td>`; }
    f+=`<td class="tot">${si_||'·'}</td><td class="tot">${(so+si_)||'·'}</td>`;
    fq+=`<td class="tot">${pi||'·'}</td><td class="tot">${(po+pi)||'·'}</td>`;
    filas+=`<tr>${f}</tr>`; filasPts+=`<tr>${fq}</tr>`;
  });
  /* fila de indices de dificultad, para ver donde cae cada golpe */
  let fsi='<td class="nom">Dificultad</td>';
  for(let h=0;h<9;h++) fsi+=`<td>${c.si[h]}</td>`; fsi+='<td>—</td>';
  for(let h=9;h<18;h++) fsi+=`<td>${c.si[h]}</td>`; fsi+='<td>—</td><td>—</td>';
  const tablaPts = !esStableford() ? '' : `
    <h2 class="sec">Puntos stableford</h2>
    <div class="scroll-x"><table class="card">
      <thead><tr>${th}</tr></thead>
      <tbody><tr class="par">${fsi}</tr>${filasPts}</tbody>
    </table></div>
    <p class="nota-txt">Par neto = 2, birdie = 3, eagle = 4, bogey = 1, peor = 0.
    El número junto a cada nombre son sus golpes de ventaja; la fila de arriba es el índice
    de dificultad de cada hoyo, que decide en cuáles los recibe.</p>`;
  $('v-tarjeta').innerHTML=`
    <div class="scroll-x"><table class="card">
      <thead><tr>${th}</tr></thead>
      <tbody><tr class="par">${fp}</tr>${filas}</tbody>
    </table></div>` + tablaPts + `
    <button class="btn" onclick="compartirDia()">Mandar este día por WhatsApp</button>
    <p class="nota-txt">Desliza la tabla para ver la segunda vuelta; los números en rojo son bajo par.
    Manda tu día al grupo para que todos tengan el torneo completo.</p>`;
  ligaScrollTarjeta();
}
/* Las dos cuadrículas de la Tarjeta (golpes y puntos) se desplazan juntas,
   igual que en Presiones; la posición sobrevive al re-render. */
let tarjScrollX=0;
function ligaScrollTarjeta(){
  const els=[...document.querySelectorAll('#v-tarjeta .scroll-x')];
  els.forEach(el=>{
    el.scrollLeft=tarjScrollX;
    el.onscroll=()=>{ tarjScrollX=el.scrollLeft;
      els.forEach(o=>{ if(o!==el && Math.abs(o.scrollLeft-tarjScrollX)>1) o.scrollLeft=tarjScrollX; }); };
  });
}

function setPos(m){ modoPos=m; render(); }

/* ---------- Grupos ---------- */
let selGrupo=null;   // {d,gi,i} del jugador tocado, para intercambiar
function tocaJugador(d,gi,i){
  if(selGrupo && selGrupo.d===d && selGrupo.gi===gi && selGrupo.i===i){ selGrupo=null; render(); return; }
  if(!selGrupo || selGrupo.d!==d){ selGrupo={d,gi,i}; render(); return; }
  const a=S.grupos[d][selGrupo.gi], b=S.grupos[d][gi];
  const t=a[selGrupo.i]; a[selGrupo.i]=b[i]; b[i]=t;
  selGrupo=null; guardar(); render();
}
/* ============================================================
   PRESIONES · match play por nueves, presion automatica al 2.
   Cada apuesta lleva su marcador y genera la suya al llegar a
   2 abajo; ninguna se cierra: corren hasta el 9 y hasta el 18.
   ============================================================ */
const VALOR_IDA    = 5;    // cada presion de la ida
const VALOR_VUELTA = 10;   // cada presion de la vuelta: vale el doble
const BONO_MAYORIA = 10;   // para quien acumule mas presiones entre las dos vueltas
/* Lista maestra de sliding del grupo.  − da golpes  ·  + los recibe. */
const LISTA_SLIDING = [
  {n:'Paulino Fernandez Mora',v:-12},{n:'Juan Pablo Fer',v:2,nota:'Blancas'},
  {n:'Dario Mora',v:-18},{n:'Francisco',v:-1},{n:'Enrique Ponzanelli',v:1},
  {n:'Eduardo Dommit',v:3},{n:'Francisco Cuevas',v:-3},{n:'Chango',v:1},
  {n:'Javier Gordillo',v:3},{n:'Ponza',v:-2},{n:'Carlos Alvarez Figueroa',v:-10},
  {n:'Víctor Reyes',v:-9},{n:'Ramón',v:-3},{n:'René Ortiz',v:5},
  {n:'Mau Medina',v:-11},{n:'Emilio Uriarte',v:-11},{n:'Paco Morales',v:-2},
  {n:'Mau Otero',v:11},{n:'Jorge Salomé',v:6},{n:'Salomón Díaz',v:1},
  {n:'Pepe Garrido',v:1},{n:'David Flores',v:6},{n:'Javier Hory',v:-1},
  {n:'Paco Sánchez',v:12},{n:'Jorge Martínez (bro)',v:7}
];
let presRival=null;
/* Handicap deslizante: golpes pactados entre dos jugadores para un dia.
   Positivo = el primero (por id) le da golpes al segundo. */
const sinAcentos=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
/* Liga un jugador con su renglón de la lista. Exige que todos los nombres de uno
   estén dentro del otro (admitiendo diminutivos: Vic → Víctor). Si hay duda, no liga. */
function casaTok(a,b){ return a===b || (a.length>=3 && b.startsWith(a)) || (b.length>=3 && a.startsWith(b)); }
function idxLista(nombre){
  const p=sinAcentos(nombre).split(/\s+/).filter(Boolean); if(!p.length) return -1;
  const cont=(chicos,grandes)=>chicos.every(t=>grandes.some(u=>casaTok(t,u)));
  const c=[];
  S.lista.forEach((e,i)=>{
    const q=sinAcentos(e.n).replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean);
    if(!q.length) return;
    if(cont(p,q)||cont(q,p)) c.push(i);
  });
  return c.length===1?c[0]:-1;
}
function valorLista(jid){ const i=idxLista(jug(jid).nombre); return i<0?null:(parseInt(S.lista[i].v,10)||0); }
/* Golpes que 'a' le da a 'b' según la lista: la diferencia entre sus valores. */
function slidingLista(a,b){ const va=valorLista(a), vb=valorLista(b);
  return (va===null||vb===null)?null:(vb-va); }
function setLista(i,campo,val){
  if(campo==='v') S.lista[i].v=Math.max(-36,Math.min(36,parseInt(val,10)||0));
  else S.lista[i][campo]=val;
  guardar(); render();
}
function agregaLista(){ S.lista.push({n:'',v:0,nota:''}); guardar(); render(); }
function borraLista(i){ S.lista.splice(i,1); guardar(); render(); }
function dejarParejos(d){
  const g=(S.grupos[d]||[]).find(x=>x.includes('j0')); if(!g) return;
  g.filter(id=>id!=='j0').forEach(rid=>setSliding(d,'j0',rid,0));
}
function aplicaListaAlDia(d){
  const g=(S.grupos[d]||[]).find(x=>x.includes('j0')); if(!g) return;
  g.filter(id=>id!=='j0').forEach(rid=>{ const v=slidingLista('j0',rid); if(v!==null) setSliding(d,'j0',rid,v); });
}
const claveSl=(d,a,b)=>d+'|'+[a,b].slice().sort().join('|');
function slidingDe(d,a,b){            // golpes que 'a' le da a 'b' (negativo = los recibe)
  const v=(S.sliding||{})[claveSl(d,a,b)]||0;
  return [a,b].slice().sort()[0]===a ? v : -v;
}
function setSliding(d,a,b,v){
  if(!S.sliding) S.sliding={};
  /* El tope tiene que dar cabida a la diferencia real de la lista: entre los ocho
     del Vail llega a 24 (Paulino -12 contra Paco +12) y en la lista completa a 30.
     Con 18 se guardaba menos de lo que anunciaba la pantalla del tee. */
  v=Math.max(-36,Math.min(36,v|0));
  const k=claveSl(d,a,b);
  if(v===0) delete S.sliding[k];
  else S.sliding[k] = ([a,b].slice().sort()[0]===a) ? v : -v;
  guardar(); render();
}
/* Sugerencia: quien perdio el dia anterior contra ese rival recibe un golpe mas. */
function slidingSugerido(d,a,b){
  if(d===0) return 0;
  const prev=slidingDe(d-1,a,b);
  const m=presionesMatch(d-1,a,b);
  if(!m.apuestas.some(x=>x.hist.some(v=>v!==null))) return prev;
  const din=m.porNueve[0]*VALOR_IDA+m.porNueve[1]*VALOR_VUELTA;
  if(din<0) return prev-1;            // 'a' perdio: recibe un golpe mas
  if(din>0) return prev+1;
  return prev;
}
function presionesMatch(d,jidA,jidB,hasta){
  if(hasta===undefined) hasta=17;
  const c=S.campos[d];
  const sv=slidingDe(d,jidA,jidB);    // + = A le da golpes a B
  const neto=(jid,h)=>{ const g=scoreDe(d,jid,h); if(g===null) return null;
    const recibe = (jid===jidA) ? (sv<0?-sv:0) : (sv>0?sv:0);
    return g - (recibe?golpesEnHoyo(recibe,c.si[h]):0); };
  const apuestas=[]; const porNueve=[];
  [[0,8,'Ida'],[9,17,'Vuelta']].forEach(([ini,fin,nom])=>{
    let aps=[{et:nom+' · salida',ini,fin,st:0,p:false,hist:new Array(18).fill(null)}];
    apuestas.push(aps[0]);
    let nPres=0;
    for(let h=ini;h<=Math.min(fin,hasta);h++){
      const na=neto(jidA,h), nb=neto(jidB,h);
      if(na===null||nb===null) continue;
      const r = na<nb?1:(na>nb?-1:0);
      aps.forEach(ap=>{ if(h>=ap.ini){ ap.st+=r; ap.hist[h]=ap.st; } });
      const nuevas=[];
      aps.forEach(ap=>{ if(!ap.p && Math.abs(ap.st)>=2 && h>=ap.ini && h<fin){
        ap.p=true; nPres++;
        nuevas.push({et:nom+' · presión '+nPres,ini:h+1,fin,st:0,p:false,hist:new Array(18).fill(null)}); } });
      aps=aps.concat(nuevas); nuevas.forEach(x=>apuestas.push(x));
    }
    porNueve.push(aps.reduce((t,ap)=>t+(ap.st>0?1:(ap.st<0?-1:0)),0));
  });
  apuestas.forEach(ap=>ap.unidad = ap.st>0?1:(ap.st<0?-1:0));
  return {apuestas,porNueve,unidades:porNueve[0]+porNueve[1]};
}
function dineroMatch(d,a,b){
  const m=presionesMatch(d,a,b);
  if(!m.apuestas.some(x=>x.hist.some(v=>v!==null))) return null;   // dia sin capturar
  let ga=0,gb=0; m.apuestas.forEach(x=>{ if(x.unidad>0)ga++; else if(x.unidad<0)gb++; });
  const bono = ga>gb?BONO_MAYORIA:(gb>ga?-BONO_MAYORIA:0);
  return m.porNueve[0]*VALOR_IDA + m.porNueve[1]*VALOR_VUELTA + bono;
}
/* Cuenta acumulada de presiones en los cuatro dias, contra cada rival que te toco */
function cuentaPresiones(){
  const porRival={}, porDia=[]; let gran=0;
  for(let dd=0; dd<DIAS; dd++){
    const g=(S.grupos[dd]||[]).find(x=>x.includes('j0'));
    let dDia=null;
    if(g) g.filter(id=>id!=='j0').forEach(rid=>{
      const din=dineroMatch(dd,'j0',rid);
      if(din===null) return;
      porRival[rid]=(porRival[rid]||0)+din; gran+=din; dDia=(dDia||0)+din;
    });
    porDia.push(dDia);
  }
  return {porRival,porDia,gran};
}
function setRival(j){ presRival=j; presScrollX=0; render(); }
/* Las dos cuadrículas de Presiones se desplazan juntas, y la posición
   sobrevive al re-render (cada golpe capturado vuelve a pintar la vista). */
let presScrollX=0;
function ligaScrollPresiones(){
  const els=[...document.querySelectorAll('#v-presiones .scroll-x')];
  els.forEach(el=>{
    el.scrollLeft=presScrollX;
    el.onscroll=()=>{ presScrollX=el.scrollLeft;
      els.forEach(o=>{ if(o!==el && Math.abs(o.scrollLeft-presScrollX)>1) o.scrollLeft=presScrollX; }); };
  });
}
function vistaPresiones(){

function setSlidingMio(d,rid,v){ setSliding(d,'j0',rid, -(parseInt(v,10)||0)); }

let slidingAbierto=false;
function seccionSliding(){

    de ese día. Si jugaron parejos, no la apliques.</p>
    ${aplicar}</details>`;
}

/* ============================================================
   4.6 FOTO DE LA TARJETA
   Toma o elige una foto, opcionalmente la lee con IA, y siempre
   pasa por una cuadrícula de revisión antes de guardar nada.
   ============================================================ */
let foto=null;          // dataURL de la foto
let borrador=null;      // {jid:[18]} en revisión
let leyendo=false, errorIA='';

function vistaFoto(){
  const d=S.diaActivo, c=S.campos[d];
  const grupo=S.grupos[d][S.grupoActivo];
  let html=`
    <div class="segm">
      <button class="${S.grupoActivo===0?'on':''}" onclick="setGrupo(0)">Grupo 1</button>

    <input type="file" id="galeria" accept="image/*" style="display:none" onchange="tomarFoto(this)">`;

  if(!foto){
    html+=`<div class="foto-zona">
      <button class="btn" style="margin:0" onclick="$('camara').click()">Tomar foto de la tarjeta</button>
      <button class="btn sec" onclick="$('galeria').click()">Elegir de la galería</button>
      <p>La foto se queda en tu teléfono. Sirve para transcribir cómodamente,
      y si configuraste tu API key también puede leerse sola.</p>
    </div>`;
  }else{
    html+=`<img src="${foto}" class="foto-prev" alt="Tarjeta fotografiada">
      <div class="foto-acc">
        <button class="btn sec" style="margin:0" onclick="$('camara').click()">Repetir foto</button>
        <button class="btn sec" style="margin:0" onclick="quitarFoto()">Quitar</button>
      </div>`;
    if(S.ia.key){
      html+=`<button class="btn" onclick="leerConIA()" ${leyendo?'disabled':''}>
        ${leyendo?'Leyendo…':'Leer los scores con IA'}</button>`;
    }else{
      html+=`<p class="nota-txt">Para que la lea sola, agrega tu API key de Anthropic en Ajustes.
        Mientras tanto, captúralos abajo mirando la foto.</p>`;
    }
  }

  if(leyendo) html+=`<div class="cargando"><span class="spin"></span> Leyendo la tarjeta…</div>`;
  if(errorIA) html+=`<div class="err">${esc(errorIA)}</div>`;

  if(!borrador) borrador=Object.fromEntries(grupo.map(jid=>
    [jid, Array.from({length:HOYOS},(_,h)=>scoreDe(d,jid,h))]));

  // Cuadrícula de revisión
  let th='<th class="nom">Jugador</th>';
  for(let h=0;h<9;h++) th+=`<th>${h+1}</th>`; th+='<th>OUT</th>';
  for(let h=9;h<18;h++) th+=`<th>${h+1}</th>`; th+='<th>IN</th><th>TOT</th>';
  let fp='<td class="nom">Par</td>';
  for(let h=0;h<9;h++) fp+=`<td>${c.par[h]}</td>`;
  fp+=`<td>${c.par.slice(0,9).reduce((a,b)=>a+b,0)}</td>`;
  for(let h=9;h<18;h++) fp+=`<td>${c.par[h]}</td>`;
  fp+=`<td>${c.par.slice(9).reduce((a,b)=>a+b,0)}</td><td>${parTotal(c)}</td>`;

  let filas='';
  grupo.forEach(jid=>{
    const j=jug(jid), v=borrador[jid]||Array(HOYOS).fill(null);
    const so=v.slice(0,9).reduce((a,b)=>a+(b||0),0), si_=v.slice(9).reduce((a,b)=>a+(b||0),0);
    let f=`<td class="nom">${esc(corto(j.nombre))}</td>`;
    for(let h=0;h<9;h++) f+=celdaInput(jid,h,v[h]);
    f+=`<td class="tot">${so||'·'}</td>`;
    for(let h=9;h<18;h++) f+=celdaInput(jid,h,v[h]);
    f+=`<td class="tot">${si_||'·'}</td><td class="tot">${(so+si_)||'·'}</td>`;
    filas+=`<tr>${f}</tr>`;
  });

  html+=`<h2 class="sec">Revisar antes de guardar</h2>
    <div class="scroll-x"><table class="card rev">
      <thead><tr>${th}</tr></thead>
      <tbody><tr class="par">${fp}</tr>${filas}</tbody>
    </table></div>
    <button class="btn" onclick="guardarBorrador()">Guardar en ${esc(c.fecha)} · Grupo ${S.grupoActivo+1}</button>
    <button class="btn sec" onclick="limpiarBorrador()">Vaciar la cuadrícula</button>
    <p class="nota-txt">Nada se guarda hasta que toques Guardar. Revisa cada número contra la foto:
    la lectura automática se equivoca con la letra manuscrita.</p>`;
  $('v-foto').innerHTML=html;
}
function celdaInput(jid,h,val){
  return `<td class="inp"><input type="number" inputmode="numeric" placeholder="·"
    value="${val??''}" onchange="setBorrador('${jid}',${h},this.value)"></td>`;
}
function setBorrador(jid,h,v){
  const n=parseInt(v);
  borrador[jid][h]=(isNaN(n)||n<1)?null:Math.min(15,n);

}
function limpiarBorrador(){
  Object.keys(borrador).forEach(k=>borrador[k]=Array(HOYOS).fill(null));
  vistaFoto();
}
function guardarBorrador(){
  const d=S.diaActivo;
  let n=0;
  Object.entries(borrador).forEach(([jid,arr])=>arr.forEach((v,h)=>{
    if(v!==null){ fijarScore(d,jid,h,v); n++; }
  }));
  alert(n+' golpes guardados en '+S.campos[d].fecha+'.');
  S.vista='tarjeta'; borrador=null; guardar(); render();

function quitarFoto(){ foto=null; errorIA=''; vistaFoto(); }

/* Comprime la foto antes de mandarla: las del iPhone son enormes */
function comprimir(file,maxLado=1600){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,maxLado/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo abrir la imagen')); };
    img.src=url;
  });
}
async function tomarFoto(input){
  const f=input.files[0]; if(!f) return;
  errorIA='';
  try{ foto=await comprimir(f); }
  catch(e){ errorIA='No se pudo abrir esa imagen. Intenta con otra.'; }
  input.value='';
  vistaFoto();
}

async function leerConIA(){
  if(!foto||!S.ia.key||leyendo) return;
  leyendo=true; errorIA=''; vistaFoto();
  const d=S.diaActivo, c=S.campos[d];
  const grupo=S.grupos[d][S.grupoActivo];
  const nombres=grupo.map(jid=>jug(jid).nombre);
  const base64=foto.split(',')[1];

  const instruccion =
`Esta es la foto de una tarjeta de golf de ${esc(c.nombre)} (par ${parTotal(c)}).
Los jugadores de este grupo son, en este orden: ${nombres.join(', ')}.

Transcribe los golpes por hoyo de cada jugador. Reglas:
- Devuelve SOLO un objeto JSON, sin explicación, sin markdown, sin backticks.
- Formato exacto: {"jugadores":[{"nombre":"...","golpes":[18 valores]}]}
- Cada golpe es un entero de 1 a 15, o null si el casillero está vacío o no se lee con certeza.
- El arreglo "golpes" siempre trae exactamente 18 posiciones, del hoyo 1 al 18.
- Usa los nombres tal como te los di; si en la tarjeta aparecen abreviados, hazlos coincidir.
- No inventes números: ante la duda, pon null.
- Ignora las filas de par, yardas e índice de dificultad; solo quiero los golpes de los jugadores.`;

  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':S.ia.key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:S.ia.modelo, max_tokens:1500,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}},
          {type:'text',text:instruccion}
        ]}]
      })
    });
    if(!r.ok){
      const t=await r.text();
      throw new Error(r.status===401?'La API key no es válida. Revísala en Ajustes.'
        :r.status===400&&t.includes('model')?'El modelo no existe. Cámbialo en Ajustes.'
        :'La API respondió '+r.status+'.');
    }
    const data=await r.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const limpio=txt.replace(/```json|```/g,'').trim();
    const obj=JSON.parse(limpio.slice(limpio.indexOf('{'),limpio.lastIndexOf('}')+1));

    let aplicados=0;
    (obj.jugadores||[]).forEach(item=>{
      const jid=emparejar(item.nombre,grupo);
      if(!jid||!Array.isArray(item.golpes)) return;
      const arr=Array(HOYOS).fill(null);
      item.golpes.slice(0,HOYOS).forEach((g,h)=>{
        const n=parseInt(g);
        if(!isNaN(n)&&n>=1&&n<=15){ arr[h]=n; aplicados++; }
      });
      borrador[jid]=arr;
    });
    if(!aplicados) errorIA='No se reconoció ningún golpe. Prueba con una foto más cerca y derecha, o captúralos a mano.';
  }catch(e){
    errorIA=e.message&&e.message.length<120?e.message
      :'No se pudo leer la tarjeta. Revisa tu conexión o captúralos a mano.';
  }
  leyendo=false; vistaFoto();
}
/* Empareja el nombre que devolvió la IA con uno de los 4 del grupo */
function emparejar(nombre,grupo){
  if(!nombre) return null;
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const n=norm(nombre);
  let hit=grupo.find(jid=>norm(jug(jid).nombre)===n);
  if(hit) return hit;
  hit=grupo.find(jid=>{ const p=norm(jug(jid).nombre).split(' ')[0]; return n.includes(p)||p.includes(n); });
  return hit||null;
}

/* ============================================================
   4.6b VER EN VIVO — sincronización con Firebase (REST)
   Sin conexión la app funciona igual: los golpes se encolan y se
   suben en cuanto vuelve la señal. Cada golpe lleva sello de tiempo
   y gana el más reciente (por celda), así dos teléfonos no se pisan.
   Los scores vacíos viajan como v:0.
   ============================================================ */
const sincronizando=()=>!!(S.sync&&S.sync.activo&&S.sync.url);
let syncOcupado=false, syncEstado='—', syncUltimo=0, timerSync=null;
const baseSync=()=>S.sync.url.replace(/\/+$/,'')+'/api/torneo/'
  +encodeURIComponent(S.sync.sala||'torneo')+'/scores';
const cabSync=()=>({'content-type':'application/json','X-Torneo-Token':S.sync.token||''});

function programarSync(){ if(!sincronizando())return; clearTimeout(timerSync); timerSync=setTimeout(()=>cicloSync(),1800); }

/* Sube la cola en lotes; el servidor solo acepta el golpe más reciente */
async function empujar(){
  if(!S.pend.length) return;
  const cola=[...S.pend];
  for(let i=0;i<cola.length;i+=200){
    const lote=cola.slice(i,i+200);
    const r=await fetch(baseSync(),{method:'POST',headers:cabSync(),
      body:JSON.stringify({celdas:lote.map(p=>({d:p.d,jid:p.jid,h:p.h,v:p.v,t:p.t}))})});
    if(r.status===401) throw new Error('token');
    if(!r.ok) throw new Error('subida '+r.status);
  }
  S.pend=S.pend.slice(cola.length); guardar();
}
async function jalar(){
  const r=await fetch(baseSync(),{headers:cabSync()});
  if(r.status===401) throw new Error('token');
  if(!r.ok) throw new Error('bajada '+r.status);
  const datos=await r.json();
  let cambios=0;
  (datos.celdas||[]).forEach(c=>{
    if(!c||typeof c.t!=='number'||!jug(c.jid)) return;
    const llave=c.d+'.'+c.jid+'.'+c.h;
    if(!(llave in S.ct)||c.t>S.ct[llave]){
      fijarScore(c.d,c.jid,c.h,c.v==null?null:c.v,c.t); cambios++;
    }
  });
  return cambios>0;
}
async function cicloSync(){
  if(!sincronizando()||syncOcupado) return;
  syncOcupado=true;
  try{
    await empujar();
    const hubo=await jalar();
    syncEstado='en línea'; syncUltimo=Date.now();
    const tecleando=typeof document!=='undefined'&&document.activeElement
      &&document.activeElement.tagName==='INPUT';
    if(hubo&&!tecleando) render(); else pintarSync();
  }catch(e){ syncEstado = e.message==='token'?'token inválido':'sin señal'; pintarSync(); }
  syncOcupado=false;
}
function pintarSync(){
  const el=$('chipSync'); if(!el||!el.style) return;
  if(!sincronizando()){ el.style.display='none'; return; }
  el.style.display='';
  const vivo=syncEstado==='en línea';
  el.textContent=(vivo?'● en vivo':(syncEstado==='token inválido'?'○ token':'○ sin señal'))
    +(S.pend.length?' · '+S.pend.length+' por subir':'');
  const color=vivo?'var(--ok)':'var(--laton)';
  el.style.borderColor=color; el.style.color=color;
}
function volcarTodo(){
  Object.entries(S.scores||{}).forEach(([kd,jugs])=>{
    const d=+kd.slice(1);
    Object.entries(jugs).forEach(([jid,arr])=>(arr||[]).forEach((v,h)=>{
      if(v!==null) S.pend.push({d,jid,h,v,t:S.ct[d+'.'+jid+'.'+h]||Date.now()});
    }));
  });
}
function setSync(k,v){
  S.sync[k]= k==='activo'? v : String(v).trim();
  if(k==='activo'&&v) volcarTodo();
  guardar(); render();
  if(sincronizando()) cicloSync();
}

/* ============================================================
   4.7 COMPARTIR Y UNIR SCORES
   Cada teléfono guarda su propia copia. Para que varios puedan
   anotar, cada quien manda su día en un código corto por WhatsApp
   y el que lo recibe lo une: se rellenan los huecos y se avisa
   de cualquier golpe que venga distinto.
   ============================================================ */
const CH='-123456789ABCDEF';   // 0 = sin anotar, 1-15 = golpes

function codificarDia(d){
  const partes=S.jugadores.map(j=>{
    const arr=Array.from({length:HOYOS},(_,h)=>scoreDe(d,j.id,h));
    if(arr.every(v=>v===null)) return null;
    return j.id+':'+arr.map(v=>CH[v==null?0:Math.min(15,Math.max(1,v))]).join('');
  }).filter(Boolean);
  return partes.length? 'PI26.'+d+'.'+partes.join(',') : null;
}
function decodificar(txt){
  const m=String(txt||'').trim().match(/PI26\.(\d)\.([^\s]+)/);
  if(!m) return null;
  const out={};
  m[2].split(',').forEach(p=>{
    const [jid,cad]=p.split(':');
    if(!jid||!cad||cad.length<HOYOS) return;
    out[jid]=cad.slice(0,HOYOS).split('').map(c=>{ const i=CH.indexOf(c); return i<=0?null:i; });
  });
  return Object.keys(out).length? {dia:+m[1],scores:out} : null;
}

/* ------------------------------------------------------------
   SEMILLA: rondas ya jugadas que viajan dentro del archivo, para
   que quien abra la app por primera vez llegue con el torneo al
   corriente sin pegar códigos a mano. Se aplica una sola vez por
   código y jamás pisa un golpe ya capturado. Va marcada con la
   fecha de la ronda, no con la de hoy, para que cualquier
   corrección posterior le gane al sincronizar.
   ------------------------------------------------------------ */
const SEMILLAS = [
  'PI26.0.j0:654757567378697457,j1:685769778666556355,j2:427434494454365565,j3:645746566367555436,j4:745664776377668347,j5:645736675356585458,j6:656634686556686567,j7:755534575466656566'
];
const SEMILLA_TS = Date.UTC(2026,7,25);      // cierre del lun 24 ago
function sembrar(){
  if(!Array.isArray(S.semillas)) S.semillas=[];
  let puestos=0;
  SEMILLAS.forEach((cod,i)=>{
    if(S.semillas.indexOf(i)>=0) return;
    const dec=decodificar(cod);
    if(!dec) return;
    Object.entries(dec.scores).forEach(([jid,arr])=>{
      if(!jug(jid)) return;
      arr.forEach((v,h)=>{
        if(v===null) return;
        if(scoreDe(dec.dia,jid,h)!==null) return;   // respeta lo capturado
        fijarScore(dec.dia,jid,h,v,SEMILLA_TS); puestos++;
      });
    });
    S.semillas.push(i);
  });
  if(puestos) guardar();
  return puestos;
}

let msgUnir='', errUnir='';
function unirCodigo(txt,sobrescribir){
  const dec=decodificar(txt);
  if(!dec){ errUnir='Ese código no se entiende. Cópialo completo, empieza con PI26.'; msgUnir=''; render(); return; }
  let nuevos=0, choques=0, iguales=0;
  Object.entries(dec.scores).forEach(([jid,arr])=>{
    if(!jug(jid)) return;
    arr.forEach((v,h)=>{
      if(v===null) return;
      const mio=scoreDe(dec.dia,jid,h);
      if(mio===null){ fijarScore(dec.dia,jid,h,v); nuevos++; }
      else if(mio!==v){ choques++; if(sobrescribir) fijarScore(dec.dia,jid,h,v); }
      else iguales++;
    });
  });
  const dia=S.campos[dec.dia];
  msgUnir=`${dia.fecha} · ${dia.nombre}: ${nuevos} golpes nuevos, ${iguales} que ya coincidían`
    + (choques? `, ${choques} distintos ${sobrescribir?'reemplazados':'que se conservaron como los tenías'}.`:'.');
  errUnir=choques&&!sobrescribir? 'Hay '+choques+' golpes que no coinciden. Si el otro teléfono tiene la versión buena, vuelve a unir con Reemplazar.':'';
  guardar(); render();
}
/* Reenvía la app al grupo: intenta mandar el archivo y, si el iPhone no
   deja adjuntarlo, manda el instructivo para que lo bajen de donde esté. */
function textoInstalacion(){
  return `🏌️ ${S.torneo.nombre} — el marcador del torneo\n\n`
    +`CÓMO INSTALARLA (una sola vez):\n`
    +`1. Toca el archivo y elige Compartir → Guardar en Archivos\n`
    +`2. Ábrelo desde Archivos: se abre en Safari\n`
    +`3. En Safari toca Compartir → Añadir a pantalla de inicio\n\n`
    +`Ya la tienes como app. Trae los 4 campos con su tarjeta real,\n`
    +`los grupos de los 4 días y el handicap de cada quien.\n\n`
    +`CÓMO USARLA:\n`
    +`• Pestaña Hoy: anota tu foursome hoyo por hoyo\n`
    +`• Al terminar la ronda: Tarjeta → Mandar este día por WhatsApp\n`
    +`• Si te llega un código: Ajustes → Unir sin pisar lo mío\n\n`
    +`Así todos quedamos con el torneo completo.`;
}
async function compartirApp(){
  const texto=textoInstalacion();
  // 1) Intentar adjuntar el archivo mismo
  try{
    const r=await fetch(location.href);
    if(r.ok){
      const html=await r.text();
      const archivo=new File([html],'pacos-invitacional-2026.html',{type:'text/html'});
      if(navigator.canShare&&navigator.canShare({files:[archivo]})){
        await navigator.share({files:[archivo],text:texto}); return;
      }
    }
  }catch(e){ /* file:// suele bloquear leerse a sí mismo */ }
  // 2) Mandar al menos el instructivo
  try{
    if(navigator.share){ await navigator.share({text:texto}); return; }
    await navigator.clipboard.writeText(texto);
    alert('Instructivo copiado. Pégalo en el grupo de WhatsApp y adjunta el archivo.');
  }catch(e){
    if(e&&e.name==='AbortError') return;
    prompt('Copia esto y mándalo por WhatsApp:',texto);
  }
}
async function compartirDia(){
  const d=S.diaActivo, cod=codificarDia(d);
  if(!cod){ alert('Todavía no hay golpes capturados en este día.'); return; }
  const texto=S.campos[d].fecha+' · '+S.campos[d].nombre+' — scores de Paco\'s Invitacional.\n'
    +'Pégalo en Ajustes → Unir scores.\n\n'+cod;
  try{
    if(navigator.share){ await navigator.share({text:texto}); return; }
    await navigator.clipboard.writeText(texto);
    alert('Código copiado. Pégalo en el grupo de WhatsApp.');
  }catch(e){
    prompt('Copia este código y mándalo por WhatsApp:',cod);
  }
}
